server {
    listen 80;
    listen [::]:80;
    server_name _; # TODO: Здесь позже добавить IP-адрес Яндекс Облака или домен

    # Максимальный размер загружаемых файлов
    client_max_body_size 20M;

    # 1. Раздача фронтенда (Статика)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Перенаправление запросов к бэкенду FastAPI
    location /api/ {
        proxy_pass http://backend:8000/; # "backend" — это имя сервиса в docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /api/openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        }
    }

    # 3. Эндпоинты для вебхуков мессенджеров (перенаправляем в бэкенд)
    location /core/ {
        proxy_pass http://backend:8000/core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
